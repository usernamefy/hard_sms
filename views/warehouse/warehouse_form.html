<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260921-8">
</head>
<body class="admin-body">
{{ template "topbar" . }}
<div class="layout">
    <aside class="sidebar">
        <nav class="menu">
            <a class="menu-item" href="/">主页</a>
            <a class="menu-item" href="/products">商品入库</a>
            <a class="menu-item active" href="/warehouses">仓库管理</a>
            <a class="menu-item" href="/borrows">借用记录</a>
            <a class="menu-item" href="javascript:void(0)">样品异动</a>
            <a class="menu-item" href="javascript:void(0)">盘点管理</a>
            <a class="menu-item" href="/users">用户管理</a>
            <a class="menu-item" href="/logs">操作日志</a>
        </nav>
    </aside>

    <main class="main">
        <div class="page-head page-head-row">
            <div>
                <h2>{{ if .isEdit }}编辑仓库{{ else }}新增仓库{{ end }}</h2>
                <p>{{ if .isEdit }}修改仓库基础信息{{ else }}创建一个新的仓库{{ end }}</p>
            </div>
            <a class="btn btn-outline" href="/warehouses">返回列表</a>
        </div>

        <div class="card form-card form-card-wide">
            {{ if .error }}
            <div class="login-alert">{{ .error }}</div>
            {{ end }}

            <div class="card-title">仓库信息</div>
            <form method="post" action="{{ .action }}" class="admin-form">
                <div class="form-grid">
                    <div class="form-item">
                        <label for="name">仓库名称 <em>*</em></label>
                        <input type="text" id="name" name="name" value="{{ .warehouse.Name }}" required maxlength="100" placeholder="请输入仓库名称">
                    </div>
                    <div class="form-item">
                        <label for="managerId">管理员</label>
                        <select id="managerId" name="managerId">
                            <option value="0">请选择管理员</option>
                            {{ range .users }}
                            <option value="{{ .ID }}" {{ if eq .ID $.warehouse.ManagerID }}selected{{ end }}>{{ .DisplayName }}</option>
                            {{ end }}
                        </select>
                    </div>
                    <div class="form-item">
                        <label for="code">仓库编码</label>
                        <input type="text" id="code" name="code" value="{{ .warehouse.Code }}" maxlength="50" placeholder="请输入仓库编码（可选）">
                    </div>
                    <div class="form-item">
                        <label for="address">仓库地址</label>
                        <input type="text" id="address" name="address" value="{{ .warehouse.Address }}" maxlength="200" placeholder="请输入仓库地址（可选）">
                    </div>
                    <div class="form-item form-item--full">
                        <label for="remark">备注</label>
                        <textarea id="remark" name="remark" maxlength="200" placeholder="请输入备注信息">{{ .warehouse.Remark }}</textarea>
                    </div>
                    <div class="form-item">
                        <label>状态</label>
                        <label class="form-checkbox-line">
                            <input type="checkbox" name="status" value="1" {{ if eq .warehouse.Status 1 }}checked{{ end }}>
                            <span>启用</span>
                        </label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存仓库</button>
                    <button type="reset" class="btn btn-outline">重 置</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
